[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tuk-convosearch"
version = "0.1.0"
description = "A modular RAG framework for high-stakes question-answering domains"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Denis Lemayian Kirionki", email = "lemayian23@users.noreply.github.com" },
]
keywords = ["rag", "retrieval-augmented-generation", "llm", "ollama", "faiss", "cancer-research", "medical-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "requests>=2.31",
    "numpy>=1.26",
]

[project.optional-dependencies]
rag = [
    "ollama>=0.1.7",
    "sentence-transformers>=2.5",
    "faiss-cpu>=1.7.4",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[project.urls]
Homepage = "https://github.com/lemayian23/tuk-convosearch"
Repository = "https://github.com/lemayian23/tuk-convosearch"
Issues = "https://github.com/lemayian23/tuk-convosearch/issues"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"